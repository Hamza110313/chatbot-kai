<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kai — Bilingual AI Chat Workspace</title>
    <meta name="description" content="Kai — Bilingual English & Urdu AI chat workspace powered by the Gemini API with persistent local conversations, syntax-highlighted code blocks, and light/dark themes." />
    <meta property="og:title" content="Kai — Bilingual AI Chat Workspace" />
    <meta property="og:description" content="Kai — Bilingual English & Urdu AI chat workspace powered by the Gemini API with persistent local conversations, syntax-highlighted code blocks, and light/dark themes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kai_ai_settings_v1');
          var theme = raw ? JSON.parse(raw).theme : 'system';
          var isDark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-black antialiased dark:bg-black dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
